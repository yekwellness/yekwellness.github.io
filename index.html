
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YEK WELLNESS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101713;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      padding: 45px 30px;
      border: 1px solid #526b51;
      border-radius: 16px;
      background: #19231c;
      box-shadow: 0 15px 50px #0005;
    }

    h1 {
      font-size: clamp(32px, 7vw, 52px);
      letter-spacing: 4px;
      margin-bottom: 18px;
    }

    h1 span {
      color: #a5c98b;
    }

    p {
      color: #c6d0c4;
      line-height: 1.8;
      margin-bottom: 22px;
    }

    .status {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      background: #243c2b;
      color: #a5e6a5;
      font-size: 14px;
    }

    button {
      display: block;
      margin: 25px auto 0;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      background: #a5c98b;
      color: #101713;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      margin-top: 30px;
      color: #819080;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>YEK <span>WELLNESS</span></h1>

    <p>
      Sağlıklı yaşama hoş geldin.<br>
      Yeni başlangıcın burada.
    </p>

    <div class="status" id="status">
      ✓ HTML sayfası başarıyla çalışıyor
    </div>

    <button onclick="testEt()">
      Sistemi test et
    </button>

    <footer>
      © <span id="yil"></span> YEK WELLNESS
      <br><br>
      GitHub Pages test sayfası
    </footer>
  </main>

  <script>
    document.getElementById("yil").textContent =
      new Date().getFullYear();

    function testEt() {
      document.getElementById("status").textContent =
        "✓ JavaScript de başarıyla çalışıyor!";
    }
  </script>

</body>
</html>
