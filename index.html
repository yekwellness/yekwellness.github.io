<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <title>Yek Wellness — İyi hisset, kendine dön</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183d35;
      --muted: #64766d;
      --green: #315e4c;
      --lime: #d9e7ad;
      --paper: #f5f4ee;
      --white: #fffefa;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 15%, rgba(217, 231, 173, .58), transparent 32%),
        radial-gradient(ellipse at 88% 84%, rgba(190, 215, 193, .48), transparent 34%),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(44px, 9vw, 92px) clamp(28px, 9vw, 88px);
      overflow: hidden;
      border: 1px solid rgba(49, 94, 76, .12);
      border-radius: 30px;
      background: rgba(255, 254, 250, .82);
      box-shadow: 0 28px 80px rgba(30, 61, 47, .10);
      animation: arrive .7s ease-out both;
    }

    main::after {
      position: absolute;
      right: -58px;
      bottom: -100px;
      width: 250px;
      height: 250px;
      border: 1px solid rgba(49, 94, 76, .13);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(49, 94, 76, .035), 0 0 0 50px rgba(49, 94, 76, .025);
      content: "";
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: var(--green);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 26px;
      height: 1px;
      background: #91a976;
      content: "";
    }

    h1 {
      max-width: 580px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.4rem, 11vw, 6.5rem);
      font-weight: 500;
      letter-spacing: -.065em;
      line-height: .94;
    }

    h1 span { color: #78945f; }

    .intro {
      max-width: 420px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.75;
    }

    .accent {
      width: 54px;
      height: 4px;
      margin-top: 36px;
      border-radius: 99px;
      background: var(--lime);
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      main { border-radius: 22px; }
      .intro { margin-top: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Yek Wellness</p>
    <h1>İyi hisset,<br><span>kendine dön.</span></h1>
    <p class="intro">Kendin için küçük bir alan aç. Daha dengeli, daha sakin ve daha iyi hissettiğin bir başlangıç.</p>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
